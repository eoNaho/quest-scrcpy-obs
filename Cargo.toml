[package]
name = "quest-scrcpy"
version = "0.3.8"
edition = "2024"
description = "Native Rust scrcpy client tuned for the Meta Quest 3 (one-eye live crop)."

[dependencies]
anyhow = "1.0.102"
bytemuck = "1.25.0"
clap = { version = "4.6.1", features = ["derive"] }
cpal = "0.18.1"
crossbeam-channel = "0.5.15"
eframe = { version = "0.34.3", features = ["wgpu"] }
egui = "0.34.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Media Foundation (decode/audio/record) is the Windows-only fallback backend;
# the cross-platform path shells out to the ffmpeg CLI instead.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
# Spout2 (DX11 CPU-buffer sender) so OBS can pick up the live view as a source
# via the Spout2 Plugin, no Window Capture needed.
spout2-rs = { version = "0.1", default-features = false, features = ["dx"] }
# Standard OS-level virtual camera, via the OBS Virtual Camera's own
# shared-memory pipe, so the view shows up as a normal webcam in *any* app
# (Zoom, Discord, browsers), not just OBS. AGPL-3.0 — see THIRD-PARTY-NOTICES.md.
virtualcam = { version = "1.0", default-features = false, features = ["obs"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.20"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1
